<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Deutsch Lernspiel — laden…</title>
    <meta name="theme-color" content="#1E3A8A">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Pure-HTML refresh — works even without JS, in WebViews, and on slow devices.
         Goes through start.html to dodge any cached app.html entry the browser still holds. -->
    <meta http-equiv="refresh" content="0; url=start.html">

    <script>
    // Unregister any leftover service worker and wipe CacheStorage before redirecting,
    // so the next page is guaranteed to fetch fresh assets.
    (async function(){
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          for(const r of regs) try{await r.unregister();}catch(e){}
        }
        if('caches' in window){
          const keys=await caches.keys();
          for(const k of keys) try{await caches.delete(k);}catch(e){}
        }
      }catch(e){}
      // Forward through start.html (which itself loads the fresh app shell).
      // Two-hop redirect defeats any cached app.html the browser still holds.
      location.replace('start.html?v=22_'+Date.now());
    })();
    </script>

    <style>
      html,body{margin:0;padding:0;height:100%;background:#1E3A8A;color:#F1EEE7;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
      .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;}
      .dot{width:48px;height:48px;border:3px solid rgba(255,255,255,.25);border-top-color:#E0A82E;border-radius:50%;animation:s 1s linear infinite;}
      @keyframes s{to{transform:rotate(360deg);}}
      h1{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;margin:0;}
      p{margin:0;opacity:.7;font-size:.9rem;}
      a{color:#E0A82E;font-weight:600;text-decoration:none;}
    </style>
</head>
<body>
    <div class="wrap">
      <div class="dot"></div>
      <h1>Deutsch Lernspiel</h1>
      <p>Lade die neue Oberfläche…</p>
      <p><a href="start.html">Hier klicken, falls die Seite nicht weiterleitet</a></p>
    </div>
</body>
</html>
