<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deutsch — Lernspiel</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#C25737">
<style>
html,body{margin:0;padding:0;height:100%;background:#F4EDE1;color:#2C2118;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
display:flex;align-items:center;justify-content:center;}
.b{width:46px;height:46px;border:3px solid rgba(194,87,55,.2);border-top-color:#C25737;
border-radius:50%;animation:r 1s linear infinite;}
@keyframes r{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="b" id="b"></div>
<script>
// Every visit to app.html bounces to react-app.html with a unique timestamp,
// so the browser can never serve a cached HTML response. The 1.8 MB React
// bundle ITSELF lives at react-app.html — this file is a 700-byte trampoline.
(function(){
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(rs){
        rs.forEach(function(r){r.unregister().catch(function(){});});
      }).catch(function(){});
    }
    if('caches' in window){
      caches.keys().then(function(ks){
        ks.forEach(function(k){caches.delete(k).catch(function(){});});
      }).catch(function(){});
    }
  }catch(e){}
  var t = Date.now() + '_' + Math.random().toString(36).slice(2,8);
  location.replace('react-app.html?b=' + t);
})();
</script>
<noscript>
  <meta http-equiv="refresh" content="0;url=react-app.html">
  <a href="react-app.html" style="color:#C25737;font-weight:600">Deutsch Lernspiel öffnen →</a>
</noscript>
</body>
</html>
