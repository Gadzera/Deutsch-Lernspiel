<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Deutsch Lernspiel v2.2 — laden…</title>
    <meta name="theme-color" content="#1E3A8A">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Fresh URL the browser has never seen before. Bounces to ../app.html with a unique
         query so any cached app.html entry the browser holds is bypassed. Pure HTML refresh
         + JS fallback — works even with JS disabled or inside a WebClip. -->
    <meta http-equiv="refresh" content="0; url=../app.html?v=22_force">

    <script>
    (async function(){
      try{
        if('serviceWorker' in navigator){
          const regs = await navigator.serviceWorker.getRegistrations();
          for(const r of regs){ try{ await r.unregister(); }catch(e){} }
        }
        if('caches' in window){
          const keys = await caches.keys();
          for(const k of keys){ try{ await caches.delete(k); }catch(e){} }
        }
      }catch(e){}
      location.replace('../app.html?v=22_' + Date.now());
    })();
    </script>

    <style>
      html,body{margin:0;padding:0;height:100%;background:#1E3A8A;color:#F1EEE7;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
      .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;}
      .dot{width:48px;height:48px;border:3px solid rgba(255,255,255,.25);border-top-color:#E0A82E;border-radius:50%;animation:s 1s linear infinite;}
      @keyframes s{to{transform:rotate(360deg);}}
      h1{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;margin:0;}
      p{margin:0;opacity:.7;font-size:.9rem;}
      a{color:#E0A82E;font-weight:600;text-decoration:none;}
    </style>
</head>
<body>
    <div class="wrap">
      <div class="dot"></div>
      <h1>Deutsch Lernspiel v2.2</h1>
      <p>Neues Design wird geladen…</p>
      <p><a href="../app.html?v=22_force">Hier klicken, falls die Seite nicht weiterleitet</a></p>
    </div>
</body>
</html>
